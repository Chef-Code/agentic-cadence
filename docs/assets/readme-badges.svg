<svg xmlns="http://www.w3.org/2000/svg" width="578" height="34" viewBox="0 0 578 34" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Cadence repository badges</title>
  <desc id="desc">Badges for Python 3.11 or newer, MIT license, PR checks, and the agentic-cadence package name.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .label { font-size: 13px; font-weight: 800; fill: #f8fafc; }
    .value { font-size: 13px; font-weight: 800; fill: #f8fafc; }
  </style>

  <rect x="0" y="0" width="134" height="34" rx="6" fill="#0f766e"/>
  <text class="label" x="16" y="22">Python 3.11+</text>

  <rect x="146" y="0" width="92" height="34" rx="6" fill="#334155"/>
  <text class="value" x="169" y="22">MIT</text>

  <rect x="250" y="0" width="116" height="34" rx="6" fill="#155e75"/>
  <text class="value" x="272" y="22">PR checks</text>

  <rect x="378" y="0" width="200" height="34" rx="6" fill="#102235" stroke="#0891b2"/>
  <text class="value" x="397" y="22">agentic-cadence</text>
</svg>
