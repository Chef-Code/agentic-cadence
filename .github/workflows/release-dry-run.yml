name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from pyproject.toml and CHANGELOG.md.
        required: true
        type: string
      tag:
        description: Release tag to verify, usually v<version>.
        required: true
        type: string
      target_ref:
        description: Optional Git ref or SHA that must match checked-out HEAD.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main with tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Run release dry run
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$TARGET_REF" ]]; then
            python scripts/cadence.py release-dry-run --cwd . --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --target-ref "$TARGET_REF" | tee "$RUNNER_TEMP/release-dry-run.json"
          else
            python scripts/cadence.py release-dry-run --cwd . --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" | tee "$RUNNER_TEMP/release-dry-run.json"
          fi
          cp "$RUNNER_TEMP/release-dry-run.json" release-dry-run.json

      - name: Prepare release artifacts
        id: inspect
        shell: bash
        run: python scripts/prepare_release_dry_run_artifacts.py

      - name: Upload release dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dry-run
          path: |
            release-dry-run.json
            release-notes.md
          if-no-files-found: error

      - name: Enforce release dry-run result
        shell: bash
        env:
          READY_TO_RELEASE: ${{ steps.inspect.outputs.ready_to_release }}
          OPERATOR_CONFIRMATION_REQUIRED: ${{ steps.inspect.outputs.operator_confirmation_required }}
        run: python scripts/enforce_release_dry_run_result.py
