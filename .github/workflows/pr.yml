name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python and protocol checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Compile Python files
        run: python -m compileall scripts codex_cadence transmission_control tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Protocol validation
        run: python scripts/validate_protocol.py

      - name: CLI smoke lifecycle
        run: python scripts/ci_smoke.py

  package:
    name: Package install and first-run examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Verify package build and installs
        run: python scripts/verify_package.py

      - name: Install package for example commands
        run: python -m pip install .

      - name: Run POSIX first-run example
        if: runner.os == 'Linux'
        run: bash examples/first-run/run.sh

      - name: Run PowerShell first-run example
        if: runner.os == 'Windows'
        run: pwsh examples/first-run/run.ps1

      - name: Run adapter smoke example
        run: python examples/adapter-smoke/run.py --cadence-python python

      - name: Run generic host-signal smoke example
        run: python examples/generic-host-signal/run.py --cadence-python python
